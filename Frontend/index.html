<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathAI - Asistente Matemático</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>MathAI 🤖✨</h1>
        <p>Tu asistente inteligente para precálculo, álgebra y cálculo</p>
    </header>

    <!-- Contenedor donde los resultados y mensajes fluyen hacia arriba -->
    <div class="chat-container" id="chatContainer">
        <div class="resultado-box">
            <h3>¡Bienvenido a MathAI! 👋</h3>
            <p>Escribe abajo cualquier problema o consulta matemática en lenguaje natural. La IA te explicará paso a paso y generará su gráfica.</p>
        </div>
    </div>

    <!-- Barra de entrada inferior central -->
    <div class="input-container">
        <div class="input-wrapper">
            <textarea id="promptUsuario" placeholder="Ej: Explícame la derivada de x³ - 6x² + 9x + 1..." rows="1"></textarea>
            <button onclick="enviarPrompt()">Resolver 🚀</button>
        </div>
    </div>

    <script>
        function enviarPrompt() {
            const texto = document.getElementById('promptUsuario').value;
            if (!texto.trim()) return;

            const container = document.getElementById('chatContainer');
            
            // Mostrar la pregunta del usuario con el estilo de tarjeta original
            container.innerHTML += `
                <div class="resultado-box user-query">
                    <strong>Tú:</strong>
                    <p>${texto}</p>
                </div>
            `;

            // Limpiar input
            document.getElementById('promptUsuario').value = '';

            // Próximamente aquí conectaremos la respuesta de la IA y el backend
        }
    </script>
</body>
</html>
