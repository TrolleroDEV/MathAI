<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathAI - Asistente Matemático</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>MathAI 🤖</h1>
        <p>Tu asistente inteligente para resolucion de problemas Matemáticos.</p>
    </header>

    
    <div class="chat-container" id="chatContainer">
        <div class="resultado-box">
            <h3>¡Bienvenido a MathAI!</h3>
            <p>Escribe abajo cualquier problema o consulta matemática en lenguaje natural. La IA te explicará paso a paso y generará su gráfica.</p>
        </div>
    </div>


    <div class="input-container">
        <div class="input-wrapper">
            <textarea id="promptUsuario" placeholder="Ej: Explícame la derivada de x³ - 6x² + 9x + 1..." rows="1"></textarea>
            <button onclick="enviarPrompt()">Enviar...</button>
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
